<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta name="theme-color" content="#07070c">
<title>GE 211 - 481</title>
<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>
<style>
@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Alexandria:wght@500;600;700;800&family=Outfit:wght@400;500;700;800&display=swap");
:root{
--bg:#07070c;
--surface:rgba(255,255,255,0.035);
--surface-strong:rgba(255,255,255,0.06);
--line:rgba(255,255,255,0.08);
--line-strong:rgba(255,255,255,0.16);
--text:#f2f1ee;
--text-dim:#9b9aa6;
--text-faint:#63626e;
--gold:#f2c14e;
--cyan:#43dcf5;
--red:#ff4d5e;
--green:#2ee08a;
--orange:#ff9f43;
--font-body:"IBM Plex Sans Arabic",sans-serif;
--font-display:"Alexandria",sans-serif;
--font-nums:"Outfit",sans-serif;
--r-lg:18px;
--r-md:14px;
--r-sm:10px;
--transition:0.3s cubic-bezier(0.4,0,0.2,1)
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scrollbar-width:none}
::-webkit-scrollbar{display:none}
::selection{background:rgba(242,193,78,0.3)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{0%{transform:scale(0.8);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes pulse-gold{0%{box-shadow:0 0 0 0 rgba(242,193,78,0.35)}70%{box-shadow:0 0 0 10px rgba(242,193,78,0)}100%{box-shadow:0 0 0 0 rgba(242,193,78,0)}}
@keyframes pulse-orange{0%{box-shadow:0 0 0 0 rgba(255,159,67,0.5)}70%{box-shadow:0 0 0 14px rgba(255,159,67,0)}100%{box-shadow:0 0 0 0 rgba(255,159,67,0)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important}}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);direction:rtl;overflow-x:hidden;line-height:1.6}
button{font-family:var(--font-body)}
a,button{outline:none}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.cosmic-bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse 120% 70% at 50% -10%,#15152a 0%,#0a0a14 45%,var(--bg) 100%)}
.cosmic-bg::after{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,0.5) 0.5px,transparent 0.5px);background-size:44px 44px;opacity:0.06;mask-image:linear-gradient(to bottom,#000 0%,transparent 60%)}
.app{min-height:100vh;position:relative;padding:24px 16px 60px}
.container{width:100%;max-width:700px;margin:0 auto}
.header{text-align:center;margin-bottom:28px;animation:fadeIn 0.8s ease;position:relative;padding-top:8px}
.title{font-family:var(--font-nums);font-weight:800;font-size:3.2rem;margin:0;background:linear-gradient(180deg,#fff 30%,#8f8f9c);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-1.5px;line-height:1.1}
.subtitle{color:var(--text-dim);font-size:0.92rem;margin-top:4px;font-weight:500}
.header-meta{display:flex;justify-content:center;gap:8px;margin-top:14px}
.meta-chip{font-family:var(--font-nums);font-size:0.72rem;font-weight:700;letter-spacing:1.5px;color:var(--gold);background:rgba(242,193,78,0.08);border:1px solid rgba(242,193,78,0.25);padding:5px 14px;border-radius:20px}
.meta-chip.neutral{color:var(--text-dim);background:var(--surface);border-color:var(--line);letter-spacing:0.5px;font-family:var(--font-body)}
.header-rule{width:120px;height:1px;margin:18px auto 0;background:linear-gradient(90deg,transparent,rgba(242,193,78,0.5),transparent)}
.explain-btn{position:absolute;top:0;left:0;background:rgba(242,193,78,0.08);border:1px solid rgba(242,193,78,0.3);color:var(--gold);border-radius:12px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--transition);z-index:10;font-size:1.05rem;animation:pulse-gold 3s infinite}
.explain-btn:hover{background:rgba(242,193,78,0.16);border-color:rgba(242,193,78,0.55);transform:translateY(-2px)}
.author-link{position:absolute;top:0;right:0;text-decoration:none;background:linear-gradient(160deg,rgba(242,193,78,0.09),rgba(255,255,255,0.02));border:1px solid rgba(242,193,78,0.28);padding:6px 12px 6px 14px;border-radius:12px;transition:var(--transition);display:flex;align-items:center;gap:9px;z-index:10}
.author-icon{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--gold);background:rgba(242,193,78,0.12);border:1px solid rgba(242,193,78,0.3);font-size:0.85rem;flex-shrink:0;transition:var(--transition)}
.author-text{display:flex;flex-direction:column;align-items:flex-start;line-height:1.3}
.author-eyebrow{font-size:0.58rem;font-weight:700;letter-spacing:0.5px;color:var(--text-dim);transition:var(--transition)}
.author-name{font-size:0.82rem;font-weight:800;color:var(--text);font-family:var(--font-display)}
.author-link:hover{border-color:rgba(242,193,78,0.55);box-shadow:0 6px 18px rgba(242,193,78,0.12);transform:translateY(-2px)}
.author-link:hover .author-icon{background:rgba(242,193,78,0.2);transform:rotate(-8deg)}
.author-link:hover .author-eyebrow{color:var(--gold)}
.nav-tabs{background:var(--surface);padding:5px;border-radius:16px;display:grid;grid-template-columns:1fr 1fr 1fr;position:relative;margin-bottom:22px;backdrop-filter:blur(12px);border:1px solid var(--line);overflow:hidden}
.nav-glider{position:absolute;top:5px;bottom:5px;width:calc((100% - 10px)/3);right:5px;background:linear-gradient(160deg,rgba(255,255,255,0.12),rgba(255,255,255,0.05));border:1px solid var(--line-strong);border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,0.35);transition:transform 0.35s cubic-bezier(0.2,0,0,1);z-index:1}
.nav-tabs[data-active="0"] .nav-glider{transform:translateX(0)}
.nav-tabs[data-active="1"] .nav-glider{transform:translateX(-100%)}
.nav-tabs[data-active="2"] .nav-glider{transform:translateX(-200%)}
.tab-btn{position:relative;z-index:2;text-align:center;padding:13px 8px;background:transparent;border:none;color:var(--text-faint);font-weight:700;font-size:0.95rem;cursor:pointer;border-radius:12px;transition:color 0.3s}
.tab-btn.active{color:var(--text)}
.sub-nav-wrapper{background:rgba(255,255,255,0.025);border-radius:14px;padding:4px;position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;margin-bottom:24px;border:1px solid rgba(255,255,255,0.05);overflow:hidden}
.sub-nav-glider{position:absolute;top:4px;bottom:4px;width:calc((100% - 8px)/3);right:4px;background:linear-gradient(145deg,rgba(255,255,255,0.09),rgba(255,255,255,0.04));border-radius:10px;transition:transform 0.3s cubic-bezier(0.2,0,0,1),border-color 0.3s,box-shadow 0.3s;border:1px solid var(--line);box-shadow:0 4px 15px rgba(0,0,0,0.2);z-index:1}
.sub-nav-wrapper[data-active="0"] .sub-nav-glider{border-color:rgba(242,193,78,0.35);box-shadow:0 0 20px rgba(242,193,78,0.08);transform:translateX(0)}
.sub-nav-wrapper[data-active="1"] .sub-nav-glider{border-color:rgba(67,220,245,0.35);box-shadow:0 0 20px rgba(67,220,245,0.08);transform:translateX(-100%)}
.sub-nav-wrapper[data-active="2"] .sub-nav-glider{border-color:rgba(255,77,94,0.35);box-shadow:0 0 20px rgba(255,77,94,0.08);transform:translateX(-200%)}
.sub-tab-item{position:relative;z-index:2;background:transparent;border:none;padding:11px 6px;font-weight:700;font-size:0.88rem;color:var(--text-faint);cursor:pointer;transition:color 0.3s;display:flex;align-items:center;justify-content:center;gap:7px}
.sub-tab-item.active{color:var(--text)}
.sub-tab-item svg{font-size:1.05rem}
.content-area{animation:fadeIn 0.4s ease-out}
.pro-resource-card{display:flex;flex-direction:column;padding:20px;margin-bottom:14px;background:linear-gradient(160deg,rgba(255,255,255,0.05),rgba(255,255,255,0.015));border:1px solid var(--line);border-radius:var(--r-lg);transition:var(--transition);backdrop-filter:blur(10px);position:relative;overflow:hidden}
.pro-resource-card:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(0,0,0,0.35);border-color:var(--line-strong)}
.pro-resource-card.pinned-file{background:linear-gradient(160deg,rgba(242,193,78,0.09),rgba(20,18,10,0.6));border:1px solid rgba(242,193,78,0.3);animation:pulse-gold 3s infinite}
.pro-resource-card.pinned-file .resource-icon-box{color:var(--gold);background:rgba(242,193,78,0.1);border-color:rgba(242,193,78,0.25)}
.resource-header{display:flex;align-items:center;gap:14px;margin-bottom:15px}
.resource-icon-box{width:46px;height:46px;flex-shrink:0;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:1.35rem;background:var(--surface);border:1px solid var(--line)}
.type-files .resource-icon-box{color:var(--cyan);background:rgba(67,220,245,0.06);border-color:rgba(67,220,245,0.15)}
.type-quizzes .resource-icon-box{color:var(--gold);background:rgba(242,193,78,0.06);border-color:rgba(242,193,78,0.15)}
.type-deliv .resource-icon-box{color:var(--green);background:rgba(46,224,138,0.06);border-color:rgba(46,224,138,0.15)}
.resource-info h3{margin:0;font-size:1.05rem;font-weight:700;color:var(--text);word-break:break-word;font-family:var(--font-display)}
.resource-info h3.latin{font-family:var(--font-nums);letter-spacing:0.2px}
.resource-info p{margin:4px 0 0;font-size:0.82rem;color:var(--text-dim)}
.resource-links{display:flex;gap:10px;flex-wrap:wrap}
.res-link-btn{flex:1;text-align:center;padding:12px;font-size:0.88rem;font-weight:600;background:rgba(0,0,0,0.25);border:1px solid var(--line);color:#cfced8;border-radius:var(--r-sm);text-decoration:none;transition:0.2s;display:flex;align-items:center;justify-content:center;gap:8px;min-width:135px;cursor:pointer}
.res-link-btn:hover{background:rgba(255,255,255,0.09);color:var(--text);transform:translateY(-2px);border-color:var(--line-strong)}
.res-link-btn.primary{border-color:var(--line-strong);background:rgba(255,255,255,0.06);color:var(--text)}
.res-link-btn.mistake-btn{border-color:rgba(255,77,94,0.3);background:rgba(255,77,94,0.08);color:#ff8b96}
.res-link-btn.mistake-btn:hover{background:rgba(255,77,94,0.16);border-color:var(--red)}
.section-separator{margin:26px 0 14px;color:var(--text-dim);font-size:0.82rem;font-weight:700;letter-spacing:0.3px;display:flex;align-items:center;gap:12px;text-transform:uppercase}
.section-separator::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.section-separator:first-child{margin-top:4px}
.quiz-active-container{background:#111116;border:1px solid var(--line);border-radius:20px;padding:24px;animation:fadeIn 0.5s ease;position:relative;box-shadow:0 20px 50px rgba(0,0,0,0.4)}
.quiz-top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.quiz-progress-bar{width:100%;height:6px;background:rgba(255,255,255,0.08);border-radius:10px;margin-bottom:25px;overflow:hidden}
.quiz-progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--cyan));border-radius:10px;transition:width 0.4s cubic-bezier(0.4,0,0.2,1)}
.exam-timer{background:rgba(255,77,94,0.1);border:1px solid rgba(255,77,94,0.3);color:#ff8b96;padding:5px 12px;border-radius:20px;font-family:var(--font-nums);font-weight:bold;font-size:0.9rem;display:flex;align-items:center;gap:5px}
.exam-timer.warning{background:rgba(255,77,94,0.85);color:#fff;animation:pulse-gold 1s infinite}
.auto-advance-wrapper{display:flex;align-items:center;gap:10px;background:var(--surface);padding:5px 10px;border-radius:20px;border:1px solid var(--line);cursor:pointer}
.toggle-switch{width:36px;height:20px;background:#333;border-radius:20px;position:relative;cursor:pointer;transition:0.3s}
.toggle-switch.on{background:var(--green)}
.toggle-knob{width:16px;height:16px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:0.3s}
.toggle-switch.on .toggle-knob{transform:translateX(16px)}
.quiz-q-counter{color:var(--text-dim);font-size:0.85rem;font-weight:bold;letter-spacing:0.5px}
.quiz-question-text{font-size:1.25rem;line-height:1.6;margin-bottom:30px;color:var(--text);font-weight:700;border-left:3px solid var(--gold);padding-left:15px}
.quiz-options-grid{display:grid;gap:12px}
.quiz-option-btn{padding:17px 20px;border-radius:var(--r-md);background:linear-gradient(145deg,rgba(255,255,255,0.03),rgba(255,255,255,0.01));border:1px solid var(--line);color:#cfced8;text-align:left;cursor:pointer;transition:all 0.2s;font-size:1.02rem;display:flex;gap:12px;align-items:center;position:relative;overflow:hidden}
.quiz-option-btn:hover:not(:disabled){background:rgba(255,255,255,0.07);transform:translateX(5px);border-color:var(--line-strong)}
.quiz-option-btn.selected{border-color:#fff;background:rgba(255,255,255,0.1);color:#fff}
.quiz-option-btn.correct{background:rgba(46,224,138,0.13);border-color:var(--green);color:var(--green);box-shadow:0 0 15px rgba(46,224,138,0.08)}
.quiz-option-btn.wrong{background:rgba(255,77,94,0.12);border-color:var(--red);color:var(--red);opacity:0.75}
.option-letter{font-weight:800;font-family:var(--font-nums);width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.3);border-radius:8px;font-size:0.9rem}
.quiz-option-btn.correct .option-letter{background:var(--green);color:#000}
.quiz-option-btn.wrong .option-letter{background:var(--red);color:#fff}
.quiz-nav-actions{display:flex;justify-content:space-between;margin-top:30px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.05)}
.quiz-nav-btn{padding:12px 25px;border-radius:12px;border:none;font-weight:700;cursor:pointer;background:#fff;color:#000;display:flex;align-items:center;gap:8px;transition:0.3s}
.quiz-nav-btn:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(255,255,255,0.2)}
.quiz-nav-btn.secondary{background:transparent;color:var(--text-dim);border:1px solid var(--line)}
.quiz-nav-btn.secondary:hover{color:var(--text);border-color:#fff;background:transparent;box-shadow:none}
.group-select-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:20px}
.group-btn{padding:15px 10px;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:12px;font-weight:700;cursor:pointer;transition:var(--transition);text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px}
.group-btn:hover{background:var(--cyan);color:#000;border-color:var(--cyan);box-shadow:0 0 15px rgba(67,220,245,0.3)}
.group-btn.all-btn{grid-column:1/-1;background:linear-gradient(90deg,var(--gold),var(--cyan));color:#000;border:none;flex-direction:row;justify-content:center}
.group-btn.random-btn{grid-column:1/-1;background:linear-gradient(135deg,var(--orange),#f4433f);color:#fff;border:none;animation:pulse-orange 3s infinite;flex-direction:row;justify-content:center}
.group-btn.random-btn:hover{transform:scale(1.02);box-shadow:0 10px 25px rgba(255,159,67,0.4)}
.beautiful-player-card{background:linear-gradient(150deg,rgba(255,255,255,0.045),rgba(255,255,255,0.015));border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;transition:0.3s;position:relative;padding:15px;margin-bottom:12px}
.beautiful-player-card:hover{border-color:rgba(255,77,94,0.4);box-shadow:0 12px 34px rgba(255,77,94,0.08)}
.player-info-section{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.vinyl-icon{font-size:1.4rem;color:var(--red);width:44px;height:44px;flex-shrink:0;background:rgba(255,77,94,0.08);border:1px solid rgba(255,77,94,0.18);border-radius:13px;display:flex;align-items:center;justify-content:center}
.player-text h3{font-size:1.02rem;color:var(--text);margin:0;font-family:var(--font-nums);font-weight:700}
.custom-html5-audio{width:100%;height:35px;outline:none;margin-top:5px;filter:invert(1) hue-rotate(180deg) grayscale(20%);opacity:0.9}
.calc-container{padding:5px}
.calc-grid{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:600px){.calc-grid{grid-template-columns:1fr 1fr}}
.calc-section-title{margin-bottom:12px;font-size:1.1rem;display:flex;align-items:center;gap:8px;font-family:var(--font-display)}
.calc-section{background:rgba(255,255,255,0.02);padding:16px;border-radius:16px;border:1px solid rgba(255,255,255,0.05)}
.input-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:12px;background:rgba(0,0,0,0.2);border-radius:12px;border:1px solid rgba(255,255,255,0.05)}
.input-row:last-child{margin-bottom:0}
.input-row label{font-size:0.88rem;color:#cfced8;flex:1;margin-left:10px;line-height:1.3}
.counter-control{display:flex;align-items:center;gap:5px;background:#000;padding:4px;border-radius:10px;border:1px solid #2a2a32;flex-shrink:0}
.counter-btn{width:32px;height:32px;border:none;background:#1d1d24;color:#fff;border-radius:8px;cursor:pointer;font-weight:bold;font-size:1.2rem;display:flex;align-items:center;justify-content:center;transition:0.2s}
.counter-btn:hover{background:#2c2c36}
.counter-btn:active{background:#3d3d4a}
.counter-val{width:30px;text-align:center;font-family:var(--font-nums);font-size:1.1rem;font-weight:700}
.grade-result{text-align:center;padding:30px;margin-top:20px;background:radial-gradient(circle at 50% 0%,rgba(94,156,255,0.08) 0%,transparent 70%);border:1px solid var(--line);border-radius:20px}
.grade-big{font-size:4rem;font-family:var(--font-nums);font-weight:800;text-shadow:0 0 30px currentColor;line-height:1.2}
.grade-A{color:#2ee08a}.grade-B{color:#4d9bff}.grade-C{color:#ffd23e}.grade-D{color:#ff8c33}.grade-F{color:#ff3b52}
.defects-text{font-size:0.88rem;color:var(--text-dim);margin-top:5px;font-family:var(--font-nums)}
.reset-btn{background:transparent;border:1px solid rgba(255,77,94,0.3);color:#ff8b96;padding:9px 18px;border-radius:9px;margin-top:16px;cursor:pointer;font-size:0.8rem;font-weight:600;transition:0.2s}
.reset-btn:hover{background:rgba(255,77,94,0.1);border-color:var(--red)}
.missed-btn{width:100%;display:flex;justify-content:center;align-items:center;padding:18px;margin-top:22px;border-radius:16px;cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,0.03);transition:all 0.3s;text-align:center}
.missed-btn:active{transform:scale(0.98)}
.missed-btn.active{background:rgba(255,77,94,0.12);border-color:var(--red);box-shadow:0 0 20px rgba(255,77,94,0.15)}
.missed-info{display:flex;flex-direction:column;align-items:center}
.missed-title{font-weight:700;font-size:1rem;color:#cfced8;transition:0.3s}
.missed-btn.active .missed-title{color:var(--red)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(10px);z-index:1000;display:flex;justify-content:center;align-items:center;padding:20px}
.modal-content{background:#111116;width:100%;max-width:400px;border-radius:24px;border:1px solid var(--line);padding:30px;position:relative;box-shadow:0 24px 60px rgba(0,0,0,0.6);animation:popIn 0.3s ease;max-height:90vh;overflow-y:auto}
.modal-title{text-align:center;font-size:1.3rem;margin-bottom:25px;font-weight:800;color:var(--text);font-family:var(--font-display)}
.modal-close{position:absolute;top:15px;left:15px;background:none;border:none;color:var(--text-dim);font-size:1.5rem;cursor:pointer;transition:0.2s}
.modal-close:hover{color:var(--text)}
.explain-modal{max-width:460px}
.modal-subtitle{text-align:center;font-family:var(--font-nums);font-size:0.72rem;font-weight:700;letter-spacing:2px;color:var(--gold);margin:-20px 0 22px}

const InteractiveQuiz = ({ url, onClose, onFinish, reviewData }) => {
const[questions, setQuestions] = useState([]), [currentQ, setCurrentQ] = useState(0),[score, setScore] = useState(0);
const [showScore, setShowScore] = useState(false),[selectedOption, setSelectedOption] = useState(null), [autoAdvance, setAutoAdvance] = useState(false);
const[allQ, setAllQ] = useState([]), [groups, setGroups] = useState([]),[selectedGroup, setSelectedGroup] = useState(null), [loading, setLoading] = useState(true);
const[userAnswers, setUserAnswers] = useState({});
const [isReview, setIsReview] = useState(false);
const[timeLeft, setTimeLeft] = useState(null);

useEffect(() => {
if(!url) return;
fetch(url).then(r=>r.text()).then(text => {
const parsed =[], lines = text.split('\n');
let grp="General", q=null;
lines.forEach(l => {
l=l.trim(); if(!l) return;
if(l.startsWith('{') && l.endsWith('}')) { if(q) q.explanation = l.slice(1, -1); return; }
if(/^[A-E]$/i.test(l)) { if(q){q.answer=l.toUpperCase();q.group=grp;parsed.push(q);q=null;} return; }
const opt = l.match(/^([A-E])\s*(.+)/i);
if(opt) { if(q) q.options.push({letter:opt[1].toUpperCase(),text:opt[2]}); return; }
if(!q) {
if(/^(AI|\d{3}(\s+(AM|PM))?|General|Journal|[A-Z0-9\s]{2,15})$/i.test(l)&&!l.includes(')')) grp=l;
else q={id:parsed.length,text:l,options:[],answer:null,group:grp};
} else q.text+=" "+l;
});
if(q&&q.answer){q.group=grp;parsed.push(q);}
setAllQ(parsed); setGroups([...new Set(parsed.map(i=>i.group))]); setLoading(false);
if(reviewData) {
    const wrongQs = parsed.filter(q => reviewData[q.id] && reviewData[q.id] !== q.answer);
    setQuestions(wrongQs); setUserAnswers(reviewData); setIsReview(true);
}
});
}, [url, reviewData]);

useEffect(() => {
    if (timeLeft === null || showScore || selectedGroup === null) return;
    if (timeLeft === 0) {
        setShowScore(true);
        if (onFinish) onFinish(userAnswers);
        return;
    }
    const timerId = setInterval(() => setTimeLeft(t => t - 1), 1000);
    return () => clearInterval(timerId);
}, [timeLeft, showScore, selectedGroup]);

const formatTime = (seconds) => {
    const m = Math.floor(seconds / 60).toString().padStart(2, '0');
    const s = (seconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
};

const start = (g) => { 
    setQuestions(g==='ALL'?allQ:allQ.filter(x=>x.group===g)); 
    setSelectedGroup(g); setCurrentQ(0); setScore(0); setShowScore(false); setUserAnswers({}); setIsReview(false); 
    setTimeLeft(null);
};

const startRandomQuiz = () => {
    const shuffled = [...allQ].sort(() => 0.5 - Math.random());
    const selected = shuffled.slice(0, Math.min(10, shuffled.length));
    setQuestions(selected);
    setSelectedGroup('اختبار سريع (10 أسئلة)');
    setCurrentQ(0); setScore(0); setShowScore(false); setUserAnswers({}); setIsReview(false);
    setTimeLeft(10 * 60);
};

const next = () => { if(currentQ<questions.length-1){setCurrentQ(c=>c+1);setSelectedOption(null);}else { setShowScore(true); if(onFinish) onFinish(userAnswers); } };
const handle = (l) => { if(selectedOption)return; setSelectedOption(l); const newAns = {...userAnswers, [questions[currentQ].id]: l}; setUserAnswers(newAns); if(l===questions[currentQ].answer)setScore(s=>s+1); if(autoAdvance)setTimeout(next,1000); };

if(loading) return <div className="quiz-active-container" style={{textAlign:'center'}}>جاري التحميل...</div>;
if(isReview) return (
<div className="quiz-active-container">
<h3 style={{marginBottom:'15px', color:'var(--red)', textAlign:'center'}}>مراجعة الأخطاء ({questions.length})</h3>
{questions.map((q, i) => (
<div key={i} className="review-card">
<div className="q-text">{q.text}</div>
<div className="ans-row wrong"><Icons.Check style={{transform:'rotate(45deg)'}}/> إجابتك: {q.options.find(o=>o.letter===userAnswers[q.id])?.text}</div>
<div className="ans-row correct"><Icons.Check/> الصحيح: {q.options.find(o=>o.letter===q.answer)?.text}</div>
{q.explanation && <div className="explanation-box">💡 {q.explanation}</div>}

const cNCE=st.cNCE>=2?3:(st.cNCE===1?2:0);
const cT=cL+cNI+cNCE;
const lL=st.lLapses>=8?3:(st.lLapses>=6?2:(st.lLapses>=4?1:0));
const lNI=st.lNI>=5?3:(st.lNI>=3?2:(st.lNI>=1?1:0));
const lNCE=st.lNCE>=2?3:(st.lNCE===1?2:0);
const lT=lL+lNI+lNCE;
const t=cT+lT;
if(st.missed||t>=5||cT>=3||lT>=3)return{g:'F',cd:cT,ld:lT};
const cg=cT===0?(st.cE>=4?'A':'B'):(cT===1?'C':'D');
const lg=lT===0?(st.lE>=5?'A':'B'):(lT===1?'C':'D');
const map={'AA':'A+','AB':'A','AC':'B+','AD':'B','BB':'B+','BC':'B','BD':'C+','CC':'C+','CD':'C','DD':'D'};
let finalG=map[[cg,lg].sort().join('')]||'F';
if(t===4)finalG='D';
return{g:finalG,cd:cT,ld:lT};
};
const res = calc();

);
};
